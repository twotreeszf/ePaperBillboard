<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置</title>
<style>
body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; background: #f4f4f4; }
.box { max-width: 400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; text-align: center; }
a { color: #111; }
.err { color: #b00020; }
</style>
</head>
<body>
<div class="box">
<h2 id="title"></h2>
<p id="msg"></p>
<p><a href="/">返回设置</a></p>
</div>
<script>
const q = new URLSearchParams(location.search);
const title = document.getElementById("title");
title.textContent = q.get("title") || "";
document.getElementById("msg").textContent = q.get("msg") || "";
if (q.get("err") === "1") title.className = "err";
</script>
</body>
</html>
